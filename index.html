}

.app-card h2 { font-size: 17px; color: var(--accent); margin-bottom: 8px; }
.app-card p { font-size: 13px; color: var(--text-secondary); }

footer {
  text-align: center;
color: var(--text-secondary);
font-size: 13px;
padding: 24px 16px;
border-top: 1px solid var(--border);
}
